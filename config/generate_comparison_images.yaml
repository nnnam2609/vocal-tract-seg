# Configuration for generating comparison images for plot alignment
# Uses test sequences from foundation_model.yaml and results from results/32

# Source data directory containing original MRI images and ground truth contours
datadir: /srv/storage/talc@storage4.nancy/multispeech/corpus/speech_production/iadi

# Directory containing inference contours from results/32
inference_dir: /srv/storage/talc2@talc-data2.nancy.grid5000.fr/multispeech/calcul/users/nhanguyen/vocal-tract-seg/results/32/test_outputs/inference_contours

# Output directory for generated comparison images
# Each sequence will have 3 subfolders: original, predict, compare
output_dir: /srv/storage/talc2@talc-data2.nancy.grid5000.fr/multispeech/calcul/users/nhanguyen/vocal-tract-seg/comparison_output

# Image loading settings
image_folder: NPY_MR
image_ext: npy

# Articulator classes to include
classes:
    - arytenoid-cartilage
    - epiglottis
    - lower-lip
    - pharynx
    - soft-palate-midline
    - thyroid-cartilage
    - tongue
    - upper-lip
    - vocal-folds

