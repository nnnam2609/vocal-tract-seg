# Configuration for generating YOLO comparison images for plot alignment

# Source data directory containing original MRI images and ground truth contours
datadir: /srv/storage/talc@storage4.nancy/multispeech/corpus/speech_production/iadi

# Directory containing inference contours from YOLO inference
# This will be generated by inference_yolo.py
inference_dir: /srv/storage/talc2@talc-data2.nancy.grid5000.fr/multispeech/calcul/users/nhanguyen/vocal-tract-seg/results/yolo_inference/inference_contours

# Output directory for generated comparison images
# Each sequence will have 3 subfolders: original, predict, compare
output_dir: /srv/storage/talc2@talc-data2.nancy.grid5000.fr/multispeech/calcul/users/nhanguyen/vocal-tract-seg/comparison_output_yolo

# Image loading settings
image_folder: NPY_MR
image_ext: npy

# Frame filtering
# require_all_gt: only keep frames that have all GT contours (full articulators)
# require_all_pred: only keep frames that have all predicted contours
frame_filter:
    require_all_gt: true
    require_all_pred: false

# Articulator classes to include
# Note: YOLO outputs lower-lip and upper-lip separately
classes:
    - arytenoid-cartilage
    - epiglottis
    - lower-lip
    - upper-lip
    - pharynx
    - soft-palate-midline
    - thyroid-cartilage
    - tongue
    - vocal-folds

